name: deploy

on:
  push:
    branches: [main]

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - run: |
          sudo apt-get update && sudo apt-get install -y sshpass
          mkdir -p ~/.ssh
          ssh-keyscan -H 100.104.67.117 >> ~/.ssh/known_hosts

      - run: |
          mkdir -p sysroot/usr/include sysroot/usr/lib/aarch64-linux-gnu out
          rsync -a -e "sshpass -p '${{ secrets.SSH_PASSWORD }}' ssh" ubuntu@100.104.67.117:/usr/include/gpiod.h sysroot/usr/include/
          rsync -a -e "sshpass -p '${{ secrets.SSH_PASSWORD }}' ssh" ubuntu@100.104.67.117:/usr/lib/aarch64-linux-gnu/libgpiod.so* sysroot/usr/lib/aarch64-linux-gnu/

      - run: docker build -t cross-image .

      - run: |
          docker run --rm \
            -v "$PWD:/src:ro" \
            -v "$PWD/sysroot:/sysroot:ro" \
            -v "$PWD/out:/out" \
            cross-image sh -c '
              cmake -S /src -B /out -DCMAKE_TOOLCHAIN_FILE=/src/cmake/toolchains/aarch64-linux-gnu.cmake -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_C_FLAGS=-I/sysroot/usr/include -DCMAKE_CXX_FLAGS=-I/sysroot/usr/include \
                -DCMAKE_EXE_LINKER_FLAGS=-L/sysroot/usr/lib/aarch64-linux-gnu &&
              cmake --build /out --parallel'

      - run: sshpass -p '${{ secrets.SSH_PASSWORD }}' ssh -v ubuntu@100.104.67.117 "pkill -f /home/ubuntu/prod/app || true; rm -rf /home/ubuntu/prod; mkdir -p /home/ubuntu/prod"

      - run: sshpass -p '${{ secrets.SSH_PASSWORD }}' scp out/app ubuntu@100.104.67.117:/home/ubuntu/prod/app

      - run: sshpass -p '${{ secrets.SSH_PASSWORD }}' ssh ubuntu@100.104.67.117 "chmod +x /home/ubuntu/prod/app && nohup /home/ubuntu/prod/app > /home/ubuntu/prod/log.txt 2>&1 & disown"
